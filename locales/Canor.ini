; Latin-locale settings (Canor).
; Labels are Latin. CanonicalSection values are stable Canor identities.

; Variables (SCHEMA.md "INI variables", PINNED). A key's class comes from its underscores:
;   __name__   Global          internal use only
;   _name_     Scoped          internal / project use only
;   __name     Limited-usage   project use only
;   _name      Custom-usage    any custom use
;   name       Public          public / general use
; Names start with a letter and end with a letter or digit; underscore classes are lowercase.
; Keys compare case-insensitively. Names are never translated; Globals must match in every locale file.
; Comments are whole lines starting with ';'.

[Canor]
CanonicalSection=Canor
Locale=la
Scope=project-wide
Projects=CanorLingua,CanorRepositorium,CanorInfinitum

[CanorLinguae]
CanonicalSection=CanorLinguae
SupportedByDefault=true

[CanorDatabasis]
CanonicalSection=CanorDatabasis
SupportedByDefault=true

[CarmenInstinctus]
CanonicalSection=CarmenInstinctus
SupportedByDefault=true

[CanorInstinctivus]
CanonicalSection=CanorInstinctivus
SupportedByDefault=true

[CanorLingua]
CanonicalSection=CanorLingua
SupportedByDefault=true

[CanorRepositorium]
CanonicalSection=CanorRepositorium
SupportedByDefault=true

[CanorInfinitum]
CanonicalSection=CanorInfinitum
SupportedByDefault=true
